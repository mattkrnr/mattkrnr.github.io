<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matt's Apps</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧰</text></svg>">
  <style>
    :root {
      --bg: #fafaf9;
      --card: #ffffff;
      --text: #1c1917;
      --muted: #78716c;
      --border: #e7e5e4;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0a09;
        --card: #1c1917;
        --text: #fafaf9;
        --muted: #a8a29e;
        --border: #292524;
        --accent: #60a5fa;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 56px 20px;
    }
    main { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; }
    .sub { color: var(--muted); margin-top: 6px; margin-bottom: 36px; }
    .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .refresh {
      width: 38px; height: 38px; border-radius: 999px; flex: none;
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      font-size: 1.15rem; line-height: 1; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .refresh:hover { border-color: var(--accent); }
    .refresh.spin span { display: inline-block; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    html, body { overscroll-behavior-y: contain; }
    .ptr {
      position: fixed; top: 0; left: 50%; z-index: 10;
      width: 38px; height: 38px; margin-left: -19px; border-radius: 999px;
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      display: flex; align-items: center; justify-content: center; font-size: 1.15rem;
      transform: translateY(-48px); opacity: 0; pointer-events: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .ptr.settle { transition: transform 0.2s ease, opacity 0.2s ease; }
    .ptr.ready { color: var(--accent); border-color: var(--accent); }
    .ptr.spin span { display: inline-block; animation: spin 0.6s linear infinite; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 14px;
    }
    .card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    a.card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .icon { font-size: 1.9rem; line-height: 1; }
    .name { font-weight: 600; font-size: 1.05rem; }
    .desc { color: var(--muted); font-size: 0.92rem; line-height: 1.4; flex: 1; }
    .tag {
      align-self: flex-start;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .tag.live { color: var(--accent); border-color: var(--accent); }
    .soon { opacity: 0.6; cursor: default; }
  </style>
</head>
<body>
  <div class="ptr" id="ptr" aria-hidden="true"><span>↻</span></div>
  <main>
    <div class="head">
      <h1>Matt's Apps</h1>
      <button class="refresh" id="refresh" type="button" aria-label="Refresh"><span>↻</span></button>
    </div>
    <p class="sub">Little things I've built.</p>
    <div class="grid" id="apps"></div>
  </main>

  <script>
    // Add new apps here. Leave url empty for "coming soon".
    // Add "from=home" to each url so the app shows a back arrow to this page.
    const apps = [
      { name: "Wheel of Whimsy", icon: "🎡", desc: "Spin the wheel to pick a date idea.", url: "/dates/?list=matt&from=home" },
      { name: "Budget", icon: "💸", desc: "Bank CSVs sorted into categories, compared to the plan.", url: "/budget/?from=home" },
      { name: "Splits", icon: "🏃", desc: "Garmin and Fitbod workouts in one place.", url: "/splits/?from=home" },
      { name: "Journal", icon: "📓", desc: "Daily entries Claude can summarize.", url: "/journal/?from=home" },
      { name: "Flashcards", icon: "🗂️", desc: "Spaced-repetition decks on anything.", url: "/flashcards/?from=home" },
      { name: "Weekly Planner", icon: "🗓️", desc: "Plan and shift workouts and side-project time.", url: "" },
    ];

    // Refresh: reload the page, skipping any cached copy.
    function refresh() {
      const url = new URL(location.href);
      url.searchParams.set("r", Date.now());
      location.replace(url);
    }
    document.getElementById("refresh").addEventListener("click", (e) => {
      e.currentTarget.classList.add("spin");
      refresh();
    });

    // Pull down from the top of the page to refresh.
    (function pullToRefresh() {
      const ptr = document.getElementById("ptr");
      const THRESHOLD = 70, MAX = 110;
      let startY = null, dist = 0;
      const place = (d) => {
        ptr.style.transform = `translateY(${d - 48}px) rotate(${d * 3}deg)`;
        ptr.style.opacity = Math.min(d / THRESHOLD, 1);
        ptr.classList.toggle("ready", d >= THRESHOLD);
      };
      addEventListener("touchstart", (e) => {
        if (window.scrollY > 0 || e.touches.length !== 1) return;
        startY = e.touches[0].clientY; dist = 0;
        ptr.classList.remove("settle");
      }, { passive: true });
      addEventListener("touchmove", (e) => {
        if (startY === null) return;
        const dy = e.touches[0].clientY - startY;
        if (dy <= 0) { dist = 0; place(0); return; }
        dist = Math.min(dy * 0.5, MAX);
        place(dist);
      }, { passive: true });
      addEventListener("touchend", () => {
        if (startY === null) return;
        startY = null;
        ptr.classList.add("settle");
        if (dist >= THRESHOLD) {
          ptr.style.transform = "translateY(24px)";
          ptr.classList.add("spin");
          refresh();
        } else {
          place(0);
        }
      });
    })();
    // Drop the cache-busting param after a refresh so the address stays clean.
    if (new URLSearchParams(location.search).has("r")) history.replaceState(null, "", location.pathname);

    const grid = document.getElementById("apps");
    for (const app of apps) {
      const live = Boolean(app.url);
      const el = document.createElement(live ? "a" : "div");
      el.className = "card" + (live ? "" : " soon");
      if (live) el.href = app.url;
      el.innerHTML = `
        <div class="icon">${app.icon}</div>
        <div class="name">${app.name}</div>
        <div class="desc">${app.desc}</div>
        <span class="tag ${live ? "live" : ""}">${live ? "Open" : "Coming soon"}</span>`;
      grid.appendChild(el);
    }
  </script>
</body>
</html>
