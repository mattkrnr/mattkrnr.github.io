name: Update app list

on:
  schedule:
    - cron: "17 9 * * *"   # daily, ~4am ET
  workflow_dispatch:         # "Run workflow" button for an instant refresh
  push:
    branches: [main]
    paths: [apps.manual.json, scripts/update_apps.py, .github/workflows/update-apps.yml]

permissions:
  contents: write

concurrency:
  group: update-apps
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild apps.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_apps.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- apps.json && git ls-files --error-unmatch apps.json >/dev/null 2>&1; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git commit -m "Update app list"
          git push
